<style>
  @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap');

  :root {
    --paper: #fcf4b0;
    --paper-2: #f4e9a0;
    --rule: #93a9d4;
    --margin-line: #d4756e;
    --ink: #24406e;
    --pen-red: #c33b2c;
    --pencil: #98903f;
    --desk: #443d33;
    --row: 30px;
    --coil-pad: 22px;
    --top-pad: 62px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #6d6353 0%, #4c4539 60%, #3b362d 100%);
    font-family: "Kalam", "Bradley Hand", "Segoe Print", cursive;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  html, body { overscroll-behavior-y: none; }

  .desk {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: calc(48px + env(safe-area-inset-top));
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 26px 20px 34px;
    overflow-x: hidden;
  }

  .notebook {
    position: relative;
    width: 100%;
    max-width: 604px;
    padding-top: var(--coil-pad);
    perspective: 1500px;
    transform: translateX(3.2%) rotate(1.7deg);
  }

  /* sheets waiting underneath */
  .stack {
    position: absolute;
    z-index: 0;
    background: var(--paper-2);
    border-radius: 2px;
    box-shadow: 0 10px 22px rgba(0,0,0,.3);
  }
  .stack.s1 { top: calc(var(--coil-pad) + 5px); left: -4px; right: -4px; bottom: 0; }
  .stack.s2 { top: calc(var(--coil-pad) + 9px); left: -9px; right: -9px; bottom: 0; background: #e9dd93; }

  .page {
    position: relative;
    z-index: 1;
    transform-origin: top center;
    background: linear-gradient(to bottom, #fdf7c2 0 34px, var(--paper) 90px);
    padding: var(--top-pad) 22px 76px 56px;
    box-shadow: 0 18px 38px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.22);
    border-radius: 2px;
  }

  .page::before {
    content: "";
    position: absolute;
    top: calc(var(--top-pad) - 20px); bottom: 0;
    left: 46px;
    border-left: 1px solid var(--margin-line);
    opacity: .8;
  }

  .page.tearing { animation: tear .6s cubic-bezier(.5,0,.75,.4) forwards; }
  @keyframes tear {
    40%  { transform: rotateX(-38deg) translateY(-4px); opacity: 1; }
    100% { transform: rotateX(-118deg) translateY(-14px); opacity: 0; }
  }
  .page.fresh { animation: settle .32s ease-out; }
  @keyframes settle {
    from { transform: translateY(-7px) scale(.995); opacity: .4; }
    to   { transform: none; opacity: 1; }
  }

  /* wire coil across the top */
  .coils-front {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 120px;
    z-index: 5;
    pointer-events: none;
  }

  /* each ring is clipped just past its hole, so the wire reads as passing through */
  .wireclip {
    position: absolute;
    top: 0;
    width: 32px;
    height: 47px;
    overflow: hidden;
  }

  .wire {
    position: absolute;
    left: 9px;
    top: 0;
    width: 15px;
    height: 58px;
    border-radius: 50%;
    border: 5px solid #b3b9c1;
    border-top-color: #eef1f4;
    border-left-color: #dee2e6;
    border-right-color: #868c94;
    transform: rotate(8deg);
    filter: drop-shadow(2px 3px 2px rgba(0,0,0,.4));
  }

  .hole {
    position: absolute;
    top: 37px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--desk);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.45);
  }

  h1 {
    font-size: clamp(22px, 5.4vw, 31px);
    font-weight: 700;
    line-height: 1.15;
    margin: 0 0 6px;
    letter-spacing: .3px;
  }
  h1 .date {
    display: block;
    font-weight: 400;
    font-size: .62em;
    color: #4b6390;
  }

  .head {
    border-bottom: 2px solid var(--rule);
    padding-bottom: 8px;
    margin-bottom: 3px;
  }

  .lines {
    background-image: repeating-linear-gradient(
      to bottom, transparent 0 calc(var(--row) - 1px), var(--rule) calc(var(--row) - 1px) var(--row)
    );
    min-height: calc(var(--row) * 11);
    padding-top: 6px;
  }

  ol { list-style: none; margin: 0; padding: 0; }

  li {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    min-height: var(--row);
    line-height: var(--row);
    font-size: 19px;
  }

  li .num {
    flex: 0 0 auto;
    min-width: 22px;
    color: var(--pencil);
    font-weight: 700;
  }
  li .text { flex: 1 1 auto; word-break: break-word; padding-right: 4px; }
  button.text {
    font: inherit;
    text-align: left;
    background: none;
    border: 0;
    color: inherit;
    padding: 0 4px 0 0;
    cursor: pointer;
    border-radius: 3px;

  button.text:hover, button.text:focus-visible {

  .hint {
    font-size: 15px;
    color: var(--pencil);
    opacity: .9;

  li.done .text {

  li.picked .text { color: var(--pen-red); }

  .kill {
    flex: 0 0 auto;
    align-self: flex-start;
    height: var(--row);
    width: 30px;
    border: 0;
    background: none;
    color: var(--pencil);

    font-size: 20px;
    line-height: var(--row);
    opacity: .6;
    cursor: pointer;
    border-radius: 4px;
  }
  .kill:hover, .kill:focus-visible { opacity: 1; color: var(--ink); }

  .ring {
    position: absolute;
    left: -8px; right: 14px; top: -3px;
    height: calc(var(--row) + 6px);
    pointer-events: none;
    overflow: visible;
  }
  .ring path {
    fill: none;
    stroke: var(--pen-red);
    stroke-width: 2.4;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw .65s cubic-bezier(.4,.1,.3,1) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .addrow { display: flex; align-items: center; min-height: var(--row); gap: 6px; }
  .addrow .num { min-width: 22px; color: var(--pencil); opacity: .55; font-weight: 700; font-size: 19px; }
  .addrow input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 19px;
    line-height: var(--row);
    height: var(--row);
    color: var(--ink);
    outline: none;
    caret-color: var(--pen-red);
  }
  .addrow input::placeholder { color: var(--pencil); opacity: .85; }
  .addrow input:focus-visible { box-shadow: 0 -2px 0 var(--pen-red) inset; }

  .add {
    flex: 0 0 auto;
    border: 1px solid var(--rule);
    background: transparent;
    color: #4b6390;
    font: inherit;
    font-size: 18px;
    width: 30px; height: 26px;
    border-radius: 4px;
    cursor: pointer;
  }
  .add:hover { border-color: var(--ink); color: var(--ink); }

  .footer {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed #cfc27a;
    flex-wrap: wrap;
  }

  .roll {
    font-family: "Kalam", cursive;
    font-weight: 700;
    font-size: 18px;
    color: var(--paper);
    background: var(--ink);

    padding: 9px 18px 10px;
    border-radius: 3px;

    transform: rotate(-1.1deg);
    box-shadow: 2px 3px 0 rgba(36,64,110,.3);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .roll:hover { transform: rotate(-1.1deg) translateY(-1px); box-shadow: 2px 5px 0 rgba(36,64,110,.3); }
  .roll:active { transform: rotate(-1.1deg) translateY(2px); box-shadow: 1px 1px 0 rgba(36,64,110,.3); }
  .roll[disabled] { opacity: .5; cursor: default; transform: rotate(-1.1deg); }

  .sheet-btn {
    font-family: "Kalam", cursive;
    font-size: 16px;
    color: #6b6430;
    background: transparent;
    border: 1px solid #cfc27a;
    padding: 8px 13px 9px;
    border-radius: 3px;
    cursor: pointer;
  }
  .sheet-btn:hover { border-color: var(--ink); color: var(--ink); }
  .sheet-btn[disabled] { opacity: .45; cursor: default; }

  .result {
    font-size: 20px;
    color: var(--pen-red);
    min-height: 26px;
    margin: 12px 0 0;
    transform: rotate(-.6deg);
  }
  .result.note { color: var(--pencil); transform: none; font-size: 19px; }
  .result .undo {
    font: inherit;
    background: none;
    border: 0;
    border-bottom: 1px solid currentColor;
    color: var(--ink);
    padding: 0 0 1px;
    margin-left: 8px;
    cursor: pointer;
  }

  /* the die, only while rolling */
  .roller {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    place-items: center;
    background: rgba(28,24,18,.62);
    opacity: 0;
    transition: opacity .25s ease;
  }
  .roller.on { display: grid; opacity: 1; }

  .stage { display: grid; place-items: center; gap: 26px; perspective: 900px; }

  .cube {
    width: 120px; height: 120px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-20deg) rotateY(26deg);
  }
  .cube.spinning { animation: tumble3d .85s linear infinite; }
  @keyframes tumble3d {
    from { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    to   { transform: rotateX(360deg) rotateY(720deg) rotateZ(180deg); }
  }

  .face {
    position: absolute;
    inset: 0;
    background: #fffdf3;
    border: 3px solid var(--ink);
    border-radius: 18px;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);

    gap: 5px;
    box-shadow: inset 0 0 24px rgba(36,64,110,.14);
  }
  .face span {

  /* carry-over dialog */
  dialog.ask {
    border: 0;
    padding: 26px 26px 20px;

  /* margin doodles */

  .doodles svg {

    fill: none;

    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;

    transition: transform .3s ease;

  .doodles-top { top: calc(var(--top-pad) - 38px); right: 10px; width: 148px; height: 78px; }

  @media (max-width: 620px) {
    .doodles-top { display: none; }
    .doodles-bottom .ufo-beam { display: none; }

  /* post-it timer */
  .postit {
    position: absolute;
    left: 50%; top: 50%;
    z-index: 6;
    width: 236px;
    padding: 14px 16px 16px;
    background: linear-gradient(158deg, #fdb7c0 0%, #f89dab 60%, #f08d9e 100%);

  .postit[hidden] { display: none; }
  @keyframes stick {

    to   { transform: translate(-50%, -50%) rotate(3deg) scale(1); opacity: 1; }
  }
  .postit::after {
    content: "";
    position: absolute;
    right: 0; bottom: 0;
    border-width: 0 0 22px 22px;
    border-style: solid;
    border-color: transparent transparent rgba(0,0,0,.12) transparent;
  }
  .postit.ding { animation: ding .5s ease 3; }
  @keyframes ding {
    0%, 100% { transform: translate(-50%, -50%) rotate(3deg); }
    25% { transform: translate(-50%, -52%) rotate(-1.5deg); }
    75% { transform: translate(-50%, -48%) rotate(6deg); }

  .note-tasks {
    margin: 0 0 12px;
    padding: 0 22px 9px 0;

  .note-btn.squeeze {
    display: block;
    width: 100%;
    margin-top: 9px;

  }
  .note-btn.squeeze:disabled { opacity: .45; cursor: default; background: rgba(255,255,255,.2); }
  .note-q { font-size: 19px; margin: 4px 0 14px; text-align: center; }

  .note-btn {
    font-family: "Kalam", cursive;

  .note-x {

  .track .flyer svg { width: 100%; height: 100%; fill: none; stroke: #2b3050; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .postit:not(.paused) .track .flyer { animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -4px; }
  }

  @media (max-width: 620px) {
    .postit { width: min(78vw, 250px); padding: 14px 15px 16px; }

  :focus-visible { outline: 2px solid var(--pen-red); outline-offset: 2px; }

    :root { --row: 30px; --top-pad: 58px; }

    .ring path { animation: none; stroke-dashoffset: 0; }

</style>

<script>
  const FACES = {
    1: [5], 2: [1, 9], 3: [1, 5, 9],
    4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9]
  };

  /* rotation that brings each face to the front */
  const ORIENT = { 1: [0, 0], 2: [0, -90], 3: [-90, 0], 4: [90, 0], 5: [0, 90], 6: [0, 180] };

  const FACE_PLACEMENT = [
    { n: 1, t: 'translateZ(60px)' },
    { n: 6, t: 'rotateY(180deg) translateZ(60px)' },
    { n: 2, t: 'rotateY(90deg) translateZ(60px)' },
    { n: 5, t: 'rotateY(-90deg) translateZ(60px)' },
    { n: 3, t: 'rotateX(90deg) translateZ(60px)' },
    { n: 4, t: 'rotateX(-90deg) translateZ(60px)' }
  ];

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('input');
  const nextNumEl = document.getElementById('nextNum');
  const rollEl = document.getElementById('roll');
  const sheetEl = document.getElementById('newSheet');
  const resultEl = document.getElementById('result');
  const pageEl = document.getElementById('page');
  const frontEl = document.getElementById('coilsFront');
  const rollerEl = document.getElementById('roller');
  const cubeEl = document.getElementById('cube');
  const captionEl = document.getElementById('caption');
  const askEl = document.getElementById('ask');

  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function stamp() {
    const label = new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('today').textContent = label;
    document.title = "Today's To-Dos " + label;
  }
  stamp();

  let todos = [];
  let torn = null;
  let pickedId = null;
  let rolling = false;

  const KEY = 'pad:sheet';

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) todos = JSON.parse(raw);
    } catch (e) {
      todos = [];
    }
    render();
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {}
  }

  function newId() {
    return Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  }

  function buildCube() {
    cubeEl.innerHTML = '';
    FACE_PLACEMENT.forEach(f => {
      const face = document.createElement('div');
      face.className = 'face';
      face.style.transform = f.t;
      FACES[f.n].forEach(cell => {
        const dot = document.createElement('span');
        dot.style.gridArea = Math.ceil(cell / 3) + ' / ' + (((cell - 1) % 3) + 1);
        face.appendChild(dot);
      });
      cubeEl.appendChild(face);
    });
  }

  function drawCoils() {
    const w = pageEl.offsetWidth;
    if (!w) return;
    const pitch = 30;
    const n = Math.max(5, Math.round((w - 26) / pitch));
    const gap = (w - 26) / n;

    frontEl.innerHTML = '';

    /* holes first, then the wire that laps over the sheet into them */
    for (let i = 0; i <= n; i++) {
      const hole = document.createElement('div');
      hole.className = 'hole';
      hole.style.left = (13 + i * gap - 7) + 'px';
      frontEl.appendChild(hole);
    }

    for (let i = 0; i <= n; i++) {
      const clip = document.createElement('div');
      clip.className = 'wireclip';
      clip.style.left = (13 + i * gap - 17) + 'px';
      const wire = document.createElement('div');
      wire.className = 'wire';
      clip.appendChild(wire);
      frontEl.appendChild(clip);
    }
  }

  function render() {
    listEl.innerHTML = '';
    todos.forEach((todo, i) => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');
      if (todo.id === pickedId) li.classList.add('picked');

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = (i + 1) + '.';

      let text;
      if (todo.done) {
        text = document.createElement('span');
      } else {
        text = document.createElement('button');
        text.type = 'button';
        text.title = 'Start a timer for this one';
        text.addEventListener('click', () => startTask(todo.id));
      }
      text.className = 'text';
      text.textContent = todo.text;

      const kill = document.createElement('button');
      kill.className = 'kill';
      kill.type = 'button';
      kill.textContent = todo.done ? '↺' : '×';
      kill.setAttribute('aria-label', (todo.done ? 'Uncross ' : 'Cross off ') + todo.text);
      kill.addEventListener('click', () => toggle(todo.id));

      li.append(num, text, kill);

      if (todo.id === pickedId) {
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('class', 'ring');
        svg.setAttribute('viewBox', '0 0 320 44');
        svg.setAttribute('preserveAspectRatio', 'none');
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M14,23 C13,9 70,3 162,4 C258,5 308,11 306,22 C304,34 232,41 138,40 C46,39 12,34 13,21 C14,13 36,7 72,5');
        svg.appendChild(path);
        li.appendChild(svg);
      }

      listEl.appendChild(li);
    });

    nextNumEl.textContent = (todos.length + 1) + '.';
    sheetEl.disabled = todos.length === 0 && !torn;
    drawCoils();
  }

  function add() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    todos.push({ id: newId(), text, done: false });
    inputEl.value = '';
    inputEl.focus();
    render();
    save();
  }

  function toggle(id) {
    const todo = todos.find(t => t.id === id);
    if (!todo) return;
    todo.done = !todo.done;
    if (todo.done && id === noteTodoId) hideNote();
    if (todo.done && pickedId === id) {
      pickedId = null;
      resultEl.className = 'result note';
      resultEl.textContent = 'Crossed off. Nice.';
    }
    render();
    save();
  }

  function scribble() {
    document.querySelectorAll('.doodle').forEach(el => {
      const r = (Math.random() * 15 - 7.5).toFixed(1);
      const x = (Math.random() * 12 - 6).toFixed(1);
      const y = (Math.random() * 8 - 4).toFixed(1);
      el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + r + 'deg)';
    });
  }

  /* ---- new sheet ---- */

  function startSheet(carried) {
    todos = carried;
    pickedId = null;
    inputEl.value = '';
    stamp();
    render();
    save();
    scribble();

    resultEl.className = 'result note';
    resultEl.textContent = carried.length
      ? 'Fresh sheet, ' + carried.length + ' carried over.'
      : 'Fresh sheet.';

    if (torn && torn.length) {
      const undo = document.createElement('button');
      undo.className = 'undo';
      undo.type = 'button';
      undo.textContent = 'Put the old sheet back';
      undo.addEventListener('click', () => {
        todos = torn;
        torn = null;
        resultEl.className = 'result note';
        resultEl.textContent = '';
        render();
        save();
      });
      resultEl.appendChild(undo);
    }
    inputEl.focus();
  }

  function tearOff(carried) {
    torn = todos.slice();
    hideNote();

    if (reduced()) { startSheet(carried); return; }

    pageEl.classList.add('tearing');

    setTimeout(() => {
      pageEl.classList.remove('tearing');
      startSheet(carried);
      pageEl.classList.add('fresh');
      setTimeout(() => pageEl.classList.remove('fresh'), 340);
    }, 600);
  }

  function newSheet() {
    if (rolling) return;
    const undone = todos.filter(t => !t.done);
    if (undone.length === 0) { tearOff([]); return; }
    askEl.showModal();
  }

  document.getElementById('askYes').addEventListener('click', () => {
    const carried = todos.filter(t => !t.done).map(t => ({ id: newId(), text: t.text, done: false }));
    askEl.close();
    tearOff(carried);
  });
  document.getElementById('askNo').addEventListener('click', () => { askEl.close(); tearOff([]); });
  document.getElementById('askCancel').addEventListener('click', () => askEl.close());

  /* ---- the roll ---- */

  function roll(squeeze) {
    if (rolling) return;

    const live = todos.filter(t => !t.done);
    if (live.length === 0) {
      resultEl.className = 'result note';
      resultEl.textContent = todos.length
        ? 'Everything is crossed off. Add something or start a new sheet.'
        : 'Add a to-do first, then the die has something to land on.';
      inputEl.focus();
      return;
    }

    rolling = true;
    pickedId = null;
    if (!squeeze) hideNote();
    render();
    rollEl.disabled = true;
    sheetEl.disabled = true;
    squeezeEl.disabled = true;
    resultEl.textContent = '';

    const winner = live[Math.floor(Math.random() * live.length)];
    const number = todos.findIndex(t => t.id === winner.id) + 1;
    const face = number <= 6 ? number : 1 + Math.floor(Math.random() * 6);
    const [fx, fy] = ORIENT[face];

    captionEl.textContent = 'Rolling…';
    cubeEl.style.transition = 'none';
    cubeEl.style.transform = 'rotateX(-20deg) rotateY(26deg)';
    rollerEl.classList.add('on');
    rollerEl.setAttribute('aria-hidden', 'false');

    const finish = () => {
      rollerEl.classList.remove('on');
      rollerEl.setAttribute('aria-hidden', 'true');
      pickedId = winner.id;
      rolling = false;
      render();
      resultEl.className = 'result';
      resultEl.textContent = 'Do number ' + number + ': ' + winner.text;
      rollEl.disabled = false;
      if (squeeze) {
        noteNext(winner);
      } else {
        showNote(winner);
        document.getElementById('noteYes').focus();
      }
    };

    if (reduced()) {
      cubeEl.style.transform = 'rotateX(' + fx + 'deg) rotateY(' + fy + 'deg)';
      captionEl.textContent = 'The die says ' + face + '.';
      setTimeout(finish, 900);
      return;
    }

    cubeEl.classList.add('spinning');

    setTimeout(() => {
      cubeEl.classList.remove('spinning');
      cubeEl.style.transition = 'transform .85s cubic-bezier(.16,.84,.3,1)';
      cubeEl.style.transform = 'rotateX(' + (720 + fx) + 'deg) rotateY(' + (720 + fy) + 'deg)';
      setTimeout(() => { captionEl.textContent = 'The die says ' + face + '.'; }, 700);
      setTimeout(finish, 1500);
    }, 950);
  }

  /* ---- post-it pomodoro ---- */

  const POMODORO = 25 * 60;

  const postitEl = document.getElementById('postit');
  const noteTaskEl = document.getElementById('noteTask');
  const notePrevEl = document.getElementById('notePrev');
  const squeezeEl = document.getElementById('noteSqueeze');
  const noteAskEl = document.getElementById('noteAsk');
  const noteRunEl = document.getElementById('noteRun');
  const noteDoneEl = document.getElementById('noteDone');
  const clockEl = document.getElementById('clock');
  const flyerEl = document.getElementById('flyer');
  const pauseEl = document.getElementById('notePause');

  let noteTodoId = null;
  let ticker = null;
  let endsAt = 0;
  let left = POMODORO;
  let running = false;
  let actx = null;

  function mmss(s) {
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function noteState(which) {
    noteAskEl.hidden = which !== 'ask';
    noteRunEl.hidden = which !== 'run';
    noteDoneEl.hidden = which !== 'done';
  }

  function showNote(todo) {
    noteTodoId = todo.id;
    noteTaskEl.textContent = todo.text;
    noteTaskEl.classList.remove('empty');
    notePrevEl.textContent = '';
    notePrevEl.hidden = true;
    squeezeEl.disabled = false;
    noteState('ask');
    postitEl.classList.remove('paused', 'ding');
    postitEl.hidden = false;
    try {
      postitEl.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' });
    } catch (e) {}
  }

  function hideNote() {
    stopTicker();
    postitEl.hidden = true;
    postitEl.classList.remove('paused', 'ding');
    noteTodoId = null;
  }

  function stopTicker() {
    if (ticker) { clearInterval(ticker); ticker = null; }
    running = false;
  }

  function paint() {
    clockEl.textContent = mmss(left);
    const pct = Math.min(100, Math.max(0, ((POMODORO - left) / POMODORO) * 100));
    flyerEl.style.left = pct + '%';
    pauseEl.textContent = running ? 'Pause' : 'Resume';
    if (!running) squeezeEl.disabled = true;
    else if (noteTodoId) squeezeEl.disabled = false;
    postitEl.classList.toggle('paused', !running);
  }

  function tick() {
    left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
    paint();
    if (left === 0) timesUp();
  }

  function startTimer(seconds) {
    left = seconds;
    endsAt = Date.now() + seconds * 1000;
    running = true;
    noteState('run');
    paint();
    if (ticker) clearInterval(ticker);
    ticker = setInterval(tick, 250);
  }

  function togglePause() {
    if (running) {
      stopTicker();
      paint();
    } else {
      endsAt = Date.now() + left * 1000;
      running = true;
      ticker = setInterval(tick, 250);
      paint();
    }
  }

  function timesUp() {
    stopTicker();
    paint();
    noteState('done');
    postitEl.classList.remove('paused');
    postitEl.classList.add('ding');
    alarm();
  }

  function primeAudio() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!actx && Ctx) actx = new Ctx();
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }

  function alarm() {
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime + 0.05;
      for (let burst = 0; burst < 3; burst++) {
        for (let i = 0; i < 3; i++) {
          const t = t0 + burst * 0.95 + i * 0.17;
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'square';
          osc.frequency.value = i === 2 ? 1046 : 880;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
          osc.connect(gain).connect(actx.destination);
          osc.start(t);
          osc.stop(t + 0.16);
        }
      }
    } catch (e) {}
  }

  document.getElementById('noteYes').addEventListener('click', () => {
    primeAudio();
    startTimer(POMODORO);
  });

  document.getElementById('noteNo').addEventListener('click', hideNote);
  document.getElementById('noteClose').addEventListener('click', hideNote);
  pauseEl.addEventListener('click', togglePause);

  document.getElementById('noteMore').addEventListener('click', () => startTimer(POMODORO));

  /* hand the note its next task, keeping one crossed-off line above it */
  function noteNext(todo) {
    notePrevEl.textContent = noteTaskEl.textContent;
    notePrevEl.hidden = false;
    noteTaskEl.textContent = todo.text;
    noteTaskEl.classList.remove('empty');
    noteTodoId = todo.id;
    squeezeEl.disabled = false;
  }

  function squeezeAnother() {
    if (rolling || !running) return;

    const current = todos.find(t => t.id === noteTodoId);
    if (current) {
      current.done = true;
      if (pickedId === current.id) pickedId = null;
      render();
      save();
    }

    if (todos.some(t => !t.done)) {
      roll(true);
      return;
    }

    /* nothing left on the sheet to move on to */
    notePrevEl.textContent = noteTaskEl.textContent;
    notePrevEl.hidden = false;
    noteTaskEl.textContent = 'Nothing left to pick.';
    noteTaskEl.classList.add('empty');
    noteTodoId = null;
    squeezeEl.disabled = true;
    resultEl.className = 'result note';
    resultEl.textContent = 'Everything is crossed off.';
  }

  squeezeEl.addEventListener('click', squeezeAnother);

  function completeCurrent() {
    const todo = todos.find(t => t.id === noteTodoId);
    hideNote();
    if (todo) {
      todo.done = true;
      if (pickedId === todo.id) pickedId = null;
      render();
      save();
      resultEl.className = 'result note';
      resultEl.textContent = 'Crossed off. Nice.';
    }
  }

  document.getElementById('noteFinish').addEventListener('click', completeCurrent);
  document.getElementById('noteStop').addEventListener('click', completeCurrent);

  /* pick a task by hand instead of by die */
  function startTask(id) {
    if (rolling) return;
    const todo = todos.find(t => t.id === id);
    if (!todo || todo.done) return;

    hideNote();
    pickedId = todo.id;
    render();

    resultEl.className = 'result';
    resultEl.textContent = 'Doing number ' + (todos.indexOf(todo) + 1) + ': ' + todo.text;

    showNote(todo);
    document.getElementById('noteYes').focus();
  }

  document.getElementById('add').addEventListener('click', add);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  rollEl.addEventListener('click', () => roll(false));
  sheetEl.addEventListener('click', newSheet);

  if (window.ResizeObserver) new ResizeObserver(drawCoils).observe(pageEl);
  window.addEventListener('resize', drawCoils);

  buildCube();
  drawCoils();
  scribble();
  load();
</script>
